astar:
  ros__parameters:
    # 原导航算法接口, 算法参数保留在源码中
    grid_map_topic: combined_grid
    odom_topic: /odom
    odom_frame: odom
    goal_topic: /goal_pose

map_pub:
  ros__parameters:
    # 保留导航同事实测的局部栅格参数
    grid_width: 10.0
    grid_height: 10.0
    resolution: 0.1
    min_height: 0.1
    max_height: 1.0
    obstacle_radius: 0.2
    obstacle_height_threshold: 0.25
    odom_topic: /odom
    lidar_topic: /cloud_registered
    odom_frame: odom
    diagnostics_enabled: true
    diagnostics_period_sec: 30.0
    diagnostics_budget_ms: 100.0

start_nav:
  ros__parameters:
    # 原路径跟随算法接口, 算法参数保留在源码中
    odom_topic: /odom
    lidar_topic: /cloud_registered
    cmd_vel_topic: /cmd_vel
    diagnostics_enabled: true
    diagnostics_period_sec: 30.0
    diagnostics_scan_budget_ms: 100.0
    diagnostics_control_budget_ms: 20.0

wildos_velocity_sender:
  ros__parameters:
    input_topic: /cmd_vel
    target_ip: 192.168.50.2
    target_port: 9999

wildos_velocity_receiver:
  ros__parameters:
    output_topic: /cmd_vel
    bind_ip: 192.168.50.2
    bind_port: 9999
    expected_source_ip: 192.168.50.1
    command_timeout_sec: 0.25
    max_linear_x: 0.6
    max_linear_y: 0.0
    max_angular_z: 1.0
