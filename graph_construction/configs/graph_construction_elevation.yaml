# 输入输出 fallback, 集成 launch 会使用 topic profile 覆盖
global_frame: odom
odom_topic: /spot1/odom_for_scoring
grid_map_topic: /_wildos/elevation_map_source
output_grid_map_topic: /elevation_mapping_node/elevation_map_raw
nav_graph_topic: /spot1/nav_graph
viz_topic: /spot1/graph_construction_viz
publish_rate_hz: 2.0
diagnostics_enabled: true
diagnostics_period_sec: 30.0
viz_show_radius_markers: false
viz_show_full_edges: false
viz_publish_rate_hz: 1.0
max_grid_odom_time_delta_sec: 0.5

# GridMap 分类和小洞修复
grid_map_free_threshold: 0.2
grid_map_obstacle_threshold: 0.05
grid_map_min_free_component_cells: 25
grid_map_fill_hole_max_cells: 90
grid_map_fill_hole_min_free_neighbor_ratio: 0.65
grid_map_fill_elevation_radius_cells: 5

# 仅修补雷达正下方结构造成的小范围盲区, 修补射线不得穿过墙体
# GO2 站立时 MID360 中心离地 0.70m, 位于机身横向中心并向前 0.09m
robot_blind_zone_radius: 0.4
robot_blind_zone_elevation_search_radius: 4.0
robot_ground_height_offset: 0.70
robot_ground_elevation_tolerance: 0.2

# 论文 Algorithm 3 随机采样和 Algorithm 5 半径图
node_sample_count: 1000
max_free_radius: 4.0
min_obstacle_clearance: 0.5
edge_radius: 8.0
frontier_candidate_spacing: 0.5
frontier_visited_corridor_radius: 0.65
