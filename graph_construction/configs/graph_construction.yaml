# ROS topic 和 frame, 平台差异优先由 topic_profiles.yaml 覆盖
robot_namespace: spot1
global_frame: map
odom_topic: /odom
grid_topic: /spot1/traversability_grid
nav_graph_topic: /spot1/nav_graph
viz_topic: /spot1/graph_construction_viz
debug_grid_topic: /spot1/debug_traversability_grid

# 发布和诊断频率, 用于定位慢帧和运行状态
trav_class: default
publish_rate_hz: 2.0
diagnostics_log_period_sec: 5.0
slow_update_warning_ms: 200.0

# OccupancyGrid 分类阈值, 对输入地图语义敏感
free_threshold: 20
obstacle_threshold: 65

# 稀疏 graph 采样和连边参数, 影响节点密度和规划连通性
sample_stride: 8
min_node_separation: 1.0
max_free_radius: 4.0
min_obstacle_clearance: 0.5
edge_radius: 3.0
max_edge_neighbors: 6
current_node_max_edge_neighbors: 10
prune_disconnected_nodes: false

# frontier 生成和记忆参数, 影响视觉评分候选数量和稳定性
frontier_assign_radius: 5.0
frontier_min_points: 4
frontier_min_span: 0.6
frontier_border_margin: 0.8
frontier_candidate_spacing: 0.6
deadend_observation_count: 3
removed_frontier_suppression_radius: 0.0
trajectory_min_separation: 0.25
