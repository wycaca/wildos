elevation_mapping_node:
  ros__parameters:
    # frame 和输入 topic 由 launch 按 topic profile 覆盖
    map_frame: odom
    base_frame: base_link
    corrected_map_frame: odom

    # 地图尺寸和传感器有效范围, 更换 LiDAR 或场景时检查
    resolution: 0.2
    map_length: 30.0
    min_valid_distance: 0.3
    # 雷达上方 1m 外视为天花板, 避免高程图积累顶棚
    max_height_range: 1.0
    max_ray_length: 20.0

    # 更新频率
    update_variance_fps: 5.0
    update_pose_fps: 10.0
    map_acquire_fps: 5.0
    publish_statistics_fps: 1.0

    # 静态仿真不清理射线遮挡后的旧地面
    enable_visibility_cleanup: false
    enable_drift_compensation: false
    enable_drift_corrected_TF_publishing: false
    enable_pointcloud_publishing: false

    # 小推车 base_link 位于雷达中心, 实测雷达到地面约 0.90m
    # 实机仅初始化脚下局部地面, 避免人工平面越过墙体
    use_initializer_at_start: true
    initialize_method: linear
    initialize_frame_id: ["base_link"]
    initialize_tf_offset: [-0.90]
    dilation_size_initialize: 2
    initialize_tf_grid_size: 1.0

    # 服务命名空间和发布内容通常不随环境修改
    service_namespace: /elevation_mapping_cupy

    subscribers:
      livox:
        # launch 使用当前 backend 的规范化点云覆盖此值
        topic_name: /cloud_registered
        data_type: pointcloud

    publishers:
      elevation_map_raw:
        layers: ["elevation", "traversability", "variance"]
        basic_layers: ["elevation", "traversability"]
        fps: 5.0
