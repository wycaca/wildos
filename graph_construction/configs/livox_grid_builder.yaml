# frame 和 topic, 适配平台时优先由 topic_profiles.yaml 覆盖
grid_frame: map
lidar_topic: /unitree_go2/lidar/points
odom_topic: /odom
grid_topic: /spot1/traversability_grid

# 发布频率和局部地图尺寸, 影响计算量和 graph 更新范围
publish_rate_hz: 5.0
resolution: 0.2
local_width: 30.0
local_height: 30.0

# 点云过滤和障碍膨胀, 误检障碍或漏检地面时优先检查本组
min_range: 0.3
max_range: 25.0
min_obstacle_height: 0.15
max_obstacle_height: 1.8
obstacle_inflation_radius: 0.3

# OccupancyGrid 数值约定, 通常不需要改
unknown_value: -1
free_value: 0
obstacle_value: 100

# rolling grid 稳定化参数, Unity 地图旋转或跳变时优先检查本组
origin_mode: rolling
origin_snap_to_resolution: false
force_odd_grid_size: false
robot_clear_radius: 0.0
obstacle_detection_mode: ray_height

# height_diff 模式参数, 只在 obstacle_detection_mode=height_diff 时生效
height_diff_mark_rays_free: false
height_diff_fill_unobserved_as_free: false
height_diff_unknown_border_width: 0.0
height_diff_obstacle_threshold: 0.05
high_obstacle_min_height: 0.3

# TF 和扫描累计, Isaac 旋转式 LiDAR 需要累计多帧避免扇形局部图
assume_input_in_grid_frame: false
tf_timeout_sec: 0.1
scan_accumulation_time_sec: 4.0
max_accumulated_scans: 40
