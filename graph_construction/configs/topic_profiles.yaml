# 相机 AGX 实机 topic 和 frame 契约
profiles:
  robot:
    namespace: spot1

    # 两台部署主机必须保持一致
    ros_domain_id: "2"
    rmw_implementation: rmw_fastrtps_cpp

    # 坐标系由 x86 D-LIO 和相机驱动发布
    global_frame: odom
    parent_frame: odom
    odom_parent_frame: odom
    odom_child_frame: base_link
    base_frame: base_link
    cam_frame: "{}_color_optical_frame"
    pointcloud_expected_frame: dlio_odom

    # x86 已限制为 2 Hz, 本机只做 identity 扇出
    pointcloud_input_topic: /cloud_registered
    aligned_lidar_topic: /spot1/cloud_registered_local
    pointcloud_output_rate_hz: 0.0
    odom_input_topic: /odom
    odom_stamp_mode: preserve
    odom_pose_source: message

    # 三相机输入
    camera_img_topic: /spot1/realsense/{}/color/image_raw/compressed
    camera_info_topic: /spot1/realsense/{}/color/camera_info

    # WildOS 内部 topic
    odom_output_topic: /spot1/odom_for_scoring
    planner_odom_topic: odom_for_scoring
    elevation_grid_map_topic: /elevation_mapping_node/elevation_map_raw
    nav_graph_topic: /spot1/nav_graph
    graph_construction_viz_topic: /spot1/graph_construction_viz
    scored_nav_graph_topic: /spot1/scored_nav_graph
    planner_path_topic: /spot1/graphnav_planner/path
    model_viz_topic: /spot1/model_visualization
    valid_geofrontiers_topic: /spot1/within_range_geofrontiers
    score_ring_topic: /spot1/score_rings
    object_mask_topic: /spot1/object_mask
    object_search_target_topic: /spot1/object_search_target
    object_target_estimate_topic: /spot1/object_target_estimate
    object_target_estimate_viz_topic: /spot1/object_target_estimate_viz
    object_target_particles_topic: /spot1/object_target_particles
    object_reached_topic: /spot1/object_search_reached
    object_search_completed_topic: /spot1/object_search_completed
    object_search_status_topic: /spot1/object_search_status
    goal_pose_topic: /goal_pose

    # 实机场景调节项
    object_search_mask_threshold: "0.09"
    object_target_max_depth: "100.0"
    visual_frontiers_range: "9.0"
    visual_frontier_threshold: "0.6"
    object_search_object_reached_timeout_sec: "2.0"
