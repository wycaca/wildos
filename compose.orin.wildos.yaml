name: wildos-orin

services:
  wildos:
    image: wildos:${WILDOS_ORIN_IMAGE_TAG:?Set WILDOS_ORIN_IMAGE_TAG in .env}
    platform: linux/arm64
    build:
      context: ..
      dockerfile: nebula2-wildos/docker/Dockerfile.orin
      args:
        BASE_IMAGE: ${WILDOS_ORIN_BASE_IMAGE:?Set WILDOS_ORIN_BASE_IMAGE in .env}
    network_mode: host
    ipc: host
    runtime: nvidia
    shm_size: 2gb
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ${WILDOS_ENV_FILE:-.env.orin.wildos}
    environment:
      DISPLAY: ${DISPLAY:-}
    volumes:
      - wildos_ros_logs:/root/.ros/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${WILDOS_CKPT_DIR:?Set WILDOS_CKPT_DIR in .env}:/opt/wildos_ws/src/nebula2-wildos/ckpts:ro
    ulimits:
      memlock: -1
      stack: 67108864

volumes:
  wildos_ros_logs:
