name: wildos-orin

services:
  wildos:
    image: wildos:${WILDOS_ORIN_IMAGE_TAG:?Set WILDOS_ORIN_IMAGE_TAG in .env}
    platform: linux/arm64
    build:
      context: ..
      dockerfile: nebula2-wildos/docker/Dockerfile.orin
      args:
        BASE_IMAGE: ${WILDOS_ORIN_BASE_IMAGE:?Set WILDOS_ORIN_BASE_IMAGE in .env}
    network_mode: host
    runtime: nvidia
    shm_size: 2gb
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:?Set ROS_DOMAIN_ID}"
      ROS_LOCALHOST_ONLY: "${ROS_LOCALHOST_ONLY:-0}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}"
      DO_OBJECT_SEARCH: "${DO_OBJECT_SEARCH:-false}"
      WILDOS_LOG_LEVEL: "${WILDOS_LOG_LEVEL:-INFO}"
      WILDOS_VISUAL_CONFIG: "${WILDOS_VISUAL_CONFIG:-wildos_nav_conf.yaml}"
      GLOBAL_FRAME: "${GLOBAL_FRAME:-odom}"
      BASE_FRAME: "${BASE_FRAME:-base_link}"
      POINTCLOUD_INPUT_TOPIC: "${POINTCLOUD_INPUT_TOPIC:-/cloud_registered}"
      ODOM_INPUT_TOPIC: "${ODOM_INPUT_TOPIC:-/odom}"
      LIDAR_FRAME: "${LIDAR_FRAME:-lidar_link}"
      CAMERA_IMG_TOPIC: "${CAMERA_IMG_TOPIC:-/spot1/realsense/{}/color/image_raw/compressed}"
      CAMERA_INFO_TOPIC: "${CAMERA_INFO_TOPIC:-/spot1/realsense/{}/color/camera_info}"
    volumes:
      - wildos_ros_logs:/root/.ros/log
      - ${WILDOS_CKPT_DIR:?Set WILDOS_CKPT_DIR in .env}:/opt/wildos_ws/src/nebula2-wildos/ckpts:ro
    ulimits:
      memlock: -1
      stack: 67108864

volumes:
  wildos_ros_logs:
