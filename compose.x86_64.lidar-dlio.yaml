name: wildos-x86

x-x86-image: &x86-image
  image: wildos-localization:x86_64
  platform: linux/amd64
  build:
    context: ..
    dockerfile: nebula2-wildos/docker/Dockerfile.lidar-dlio
    args:
      BASE_IMAGE: ros:humble-ros-base-jammy

x-x86-runtime: &x86-runtime
  <<: *x86-image
  network_mode: host
  ipc: host
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-dds-environment: &dds-environment
  ROS_DOMAIN_ID: "2"
  ROS_LOCALHOST_ONLY: "0"
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp
  FASTDDS_DEFAULT_PROFILES_FILE: /etc/wildos/fastdds.xml
  FASTRTPS_DEFAULT_PROFILES_FILE: /etc/wildos/fastdds.xml

services:
  lidar:
    <<: *x86-runtime
    entrypoint:
      - /usr/local/bin/wildos-mid360-entrypoint
    stop_grace_period: 15s
    volumes:
      - lidar_ros_logs:/root/.ros/log
      - ./docker/fastdds.wildos.xml:/etc/wildos/fastdds.xml:ro
      - ${MID360_CONFIG_FILE:?Set MID360_CONFIG_FILE in the Compose environment}:/config/mid360.json:ro
    environment:
      <<: *dds-environment
      MID360_CONFIG_FILE: /config/mid360.json
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/wildos-mid360-healthcheck
      interval: 10s
      timeout: 15s
      start_period: 20s
      retries: 3

  localization:
    <<: *x86-runtime
    stop_grace_period: 30s
    depends_on:
      lidar:
        condition: service_healthy
    volumes:
      - localization_ros_logs:/root/.ros/log
      - ./docker/fastdds.wildos.xml:/etc/wildos/fastdds.xml:ro
      - ${DLIO_CONFIG_FILE:?Set DLIO_CONFIG_FILE in the Compose environment}:/config/dlio.yaml:ro
    environment:
      <<: *dds-environment
      DLIO_CONFIG_FILE: /config/dlio.yaml
    ulimits:
      memlock: -1
      stack: 67108864

volumes:
  lidar_ros_logs:
  localization_ros_logs:
