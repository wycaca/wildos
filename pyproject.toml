[project]
name = "wildos-local-env"
version = "0.1.0"
description = "Local uv environment for nebula2-wildos reproduction"
requires-python = ">=3.10,<3.11"
dependencies = [
  # local editable packages
  "explorfm",
  "nvidia-radio",
  # ROS 2 Humble build-time Python deps
  "empy==3.3.4",
  "catkin_pkg",
  "lark",
  "PyYAML",
  "setuptools<70",
  "wheel",
  # core
  "torch==2.7.0",
  "torchvision==0.22.0",
  # vision
  "timm==1.0.15",
  "open-clip-torch==2.32.0",
  "transformers==4.51.3",
  "einops==0.8.1",
  "scikit-image",
  "onnx",
  "opencv-python",
  "matplotlib",
  "numpy>=1.23,<2",
  # config
  "omegaconf",
  # common runtime helpers
  "pillow",
  "scipy",
  "huggingface_hub",
  "safetensors",
  "ftfy",
  "regex",
  "tqdm",
  "cupy-cuda12x>=13.6.0",
  "ros2-numpy>=0.0.5",
  "transforms3d>=0.4.2",
]

[dependency-groups]
test = [
  "flake8",
  "pydocstyle",
  "pytest>=7,<9",
]

[tool.uv.sources]
explorfm = { path = "explorfm", editable = true }
nvidia-radio = { path = "nvidia_radio", editable = true }
