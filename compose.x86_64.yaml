name: wildos-localization-x86

services:
  localization:
    image: wildos-localization:${WILDOS_X86_IMAGE_TAG:-x86_64}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: nebula2-wildos/docker/Dockerfile.x86_64
      args:
        BASE_IMAGE: ${WILDOS_X86_BASE_IMAGE:-ros:humble-ros-base-jammy}
    network_mode: host
    ipc: host
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ${LOCALIZATION_ENV_FILE:-.env.localization}
    volumes:
      - localization_ros_logs:/root/.ros/log
      - ${DLIO_CONFIG_FILE:?Set DLIO_CONFIG_FILE in the Compose environment}:/config/dlio.yaml:ro
    environment:
      DLIO_CONFIG_FILE: /config/dlio.yaml
    ulimits:
      memlock: -1
      stack: 67108864

volumes:
  localization_ros_logs:
