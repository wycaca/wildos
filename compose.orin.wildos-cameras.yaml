name: wildos-orin

x-dds-environment: &dds-environment
  ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:?Set ROS_DOMAIN_ID}"
  ROS_LOCALHOST_ONLY: "${ROS_LOCALHOST_ONLY:-0}"
  RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
  FASTDDS_DEFAULT_PROFILES_FILE: /etc/wildos/fastdds.xml
  FASTRTPS_DEFAULT_PROFILES_FILE: /etc/wildos/fastdds.xml

services:
  cameras:
    image: wildos-cameras:${WILDOS_CAMERA_IMAGE_TAG:?Set WILDOS_CAMERA_IMAGE_TAG}
    platform: linux/arm64
    build:
      context: ..
      dockerfile: nebula2-wildos/docker/Dockerfile.camera.orin
      args:
        BASE_IMAGE: ${WILDOS_CAMERA_BASE_IMAGE:-ros:humble-ros-base-jammy}
    network_mode: host
    ipc: host
    privileged: true
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      <<: *dds-environment
      BASE_FRAME: "${BASE_FRAME:-base_link}"
      CAMERA_NAMESPACE: "${CAMERA_NAMESPACE:-spot1/realsense}"
      CAMERA_COLOR_WIDTH: "${CAMERA_COLOR_WIDTH:-640}"
      CAMERA_COLOR_HEIGHT: "${CAMERA_COLOR_HEIGHT:-480}"
      CAMERA_COLOR_FPS: "${CAMERA_COLOR_FPS:-15}"
      FRONT_CAMERA_SERIAL: "${FRONT_CAMERA_SERIAL:?Set FRONT_CAMERA_SERIAL}"
      LEFT_CAMERA_SERIAL: "${LEFT_CAMERA_SERIAL:?Set LEFT_CAMERA_SERIAL}"
      RIGHT_CAMERA_SERIAL: "${RIGHT_CAMERA_SERIAL:?Set RIGHT_CAMERA_SERIAL}"
      FRONT_CAMERA_TRANSFORM: "${FRONT_CAMERA_TRANSFORM:-}"
      LEFT_CAMERA_TRANSFORM: "${LEFT_CAMERA_TRANSFORM:-}"
      RIGHT_CAMERA_TRANSFORM: "${RIGHT_CAMERA_TRANSFORM:-}"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./docker/fastdds.wildos.xml:/etc/wildos/fastdds.xml:ro
      - camera_ros_logs:/root/.ros/log

  wildos:
    image: wildos:${WILDOS_ORIN_IMAGE_TAG:?Set WILDOS_ORIN_IMAGE_TAG}
    platform: linux/arm64
    build:
      context: ..
      dockerfile: nebula2-wildos/docker/Dockerfile.orin
      args:
        BASE_IMAGE: ${WILDOS_ORIN_BASE_IMAGE:?Set WILDOS_ORIN_BASE_IMAGE}
    network_mode: host
    ipc: host
    runtime: nvidia
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      cameras:
        condition: service_healthy
    environment:
      <<: *dds-environment
      DO_OBJECT_SEARCH: "${DO_OBJECT_SEARCH:-true}"
      WILDOS_LOG_LEVEL: "${WILDOS_LOG_LEVEL:-INFO}"
      WILDOS_VISUAL_CONFIG: "${WILDOS_VISUAL_CONFIG:-wildos_nav_conf.yaml}"
    volumes:
      - wildos_ros_logs:/root/.ros/log
      - ./docker/fastdds.wildos.xml:/etc/wildos/fastdds.xml:ro
      - ${WILDOS_CKPT_DIR:?Set WILDOS_CKPT_DIR}:/opt/wildos_ws/src/nebula2-wildos/ckpts:ro
    ulimits:
      memlock: -1
      stack: 67108864

volumes:
  camera_ros_logs:
  wildos_ros_logs:
