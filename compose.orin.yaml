name: wildos-orin

services:
  wildos:
    image: wildos:${WILDOS_ORIN_IMAGE_TAG:-orin-jp62}
    platform: linux/arm64
    build:
      context: ..
      dockerfile: nebula2-wildos/docker/Dockerfile.orin
      args:
        BASE_IMAGE: ${WILDOS_ORIN_BASE_IMAGE:-nvcr.io/nvidia/pytorch:24.10-py3-igpu}
    network_mode: host
    ipc: host
    runtime: nvidia
    shm_size: 2gb
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      WILDOS_TOPIC_PROFILE: ${WILDOS_TOPIC_PROFILE:-robot}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-2}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DISPLAY: ${DISPLAY:-}
    command:
      - do_object_search:=${DO_OBJECT_SEARCH:-false}
      - use_sim_time:=${USE_SIM_TIME:-false}
      - launch_paper_rviz:=${LAUNCH_PAPER_RVIZ:-false}
      - log_level:=${WILDOS_LOG_LEVEL:-INFO}
      - localization_backend:=${LOCALIZATION_BACKEND:-platform}
      - launch_dlio:=${LAUNCH_DLIO:-false}
      - global_frame:=${GLOBAL_FRAME:-odom}
      - parent_frame:=${GLOBAL_FRAME:-odom}
      - odom_parent_frame:=${GLOBAL_FRAME:-odom}
      - odom_child_frame:=${BASE_FRAME:-base_link}
      - base_frame:=${BASE_FRAME:-base_link}
      - pointcloud_input_topic:=${POINTCLOUD_INPUT_TOPIC:-/cloud_registered}
      - odom_input_topic:=${ODOM_INPUT_TOPIC:-/odom}
      - lidar_frame:=${LIDAR_FRAME:-lidar_link}
      - publish_camera_static_tf:=${PUBLISH_CAMERA_STATIC_TF:-false}
      - cam_frame:=${CAM_FRAME:-spot1/realsense/{}_color_optical_frame}
      - camera_img_topic:=${CAMERA_IMG_TOPIC:-/spot1/realsense/{}/color/image_raw/compressed}
      - camera_info_topic:=${CAMERA_INFO_TOPIC:-/spot1/realsense/{}/color/camera_info}
    volumes:
      - wildos_ros_logs:/root/.ros/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${WILDOS_CKPT_DIR:-/mnt/ssd/han/wildos_ws/src/nebula2-wildos/ckpts}/c-radio_v3-b_half.pth.tar:/opt/wildos_ws/src/nebula2-wildos/ckpts/c-radio_v3-b_half.pth.tar:ro
      - ${WILDOS_CKPT_DIR:-/mnt/ssd/han/wildos_ws/src/nebula2-wildos/ckpts}/frontier_ckpt_new.ckpt:/opt/wildos_ws/src/nebula2-wildos/ckpts/frontier_ckpt_new.ckpt:ro
      - ${WILDOS_CKPT_DIR:-/mnt/ssd/han/wildos_ws/src/nebula2-wildos/ckpts}/traversability_ckpt.ckpt:/opt/wildos_ws/src/nebula2-wildos/ckpts/traversability_ckpt.ckpt:ro
      - ${WILDOS_CKPT_DIR:-/mnt/ssd/han/wildos_ws/src/nebula2-wildos/ckpts}/siglip2:/opt/wildos_ws/src/nebula2-wildos/ckpts/siglip2:ro
    ulimits:
      memlock: -1
      stack: 67108864

volumes:
  wildos_ros_logs:
