name: wildos-robot-orin

x-orin-lidar-image: &orin-lidar-image
  image: wildos-localization:${WILDOS_ORIN_LIDAR_IMAGE_TAG:-orin-arm64}
  platform: linux/arm64
  build:
    context: ..
    dockerfile: nebula2-wildos/docker/Dockerfile.lidar-dlio
    args:
      BASE_IMAGE: ${WILDOS_ORIN_LIDAR_BASE_IMAGE:-ros:humble-ros-base-jammy}

x-orin-lidar-runtime: &orin-lidar-runtime
  <<: *orin-lidar-image
  network_mode: host
  restart: unless-stopped

x-dds-environment: &dds-environment
  ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:?Set ROS_DOMAIN_ID}"
  ROS_LOCALHOST_ONLY: "${ROS_LOCALHOST_ONLY:-0}"
  RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}"

services:
  lidar:
    <<: *orin-lidar-runtime
    entrypoint:
      - /usr/local/bin/wildos-mid360-entrypoint
    stop_grace_period: 15s
    volumes:
      - lidar_ros_logs:/root/.ros/log
      - ${MID360_CONFIG_FILE:?Set MID360_CONFIG_FILE in the Compose environment}:/config/mid360.json:ro
    environment:
      <<: *dds-environment
      MID360_CONFIG_FILE: /config/mid360.json
      POINTCLOUD_INPUT_TOPIC: "${POINTCLOUD_INPUT_TOPIC:-/livox/lidar}"
      IMU_INPUT_TOPIC: "${IMU_INPUT_TOPIC:-/livox/imu}"
      LIDAR_FRAME: "${LIDAR_FRAME:-lidar_link}"
      LIVOX_PUBLISH_FREQ: "${LIVOX_PUBLISH_FREQ:-10.0}"
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/wildos-mid360-healthcheck
      interval: 10s
      timeout: 12s
      start_period: 20s
      retries: 3

  localization:
    <<: *orin-lidar-runtime
    stop_grace_period: 30s
    depends_on:
      lidar:
        condition: service_healthy
    volumes:
      - localization_ros_logs:/root/.ros/log
      - ${DLIO_CONFIG_FILE:?Set DLIO_CONFIG_FILE in the Compose environment}:/config/dlio.yaml:ro
    environment:
      <<: *dds-environment
      DLIO_CONFIG_FILE: /config/dlio.yaml
      POINTCLOUD_INPUT_TOPIC: "${POINTCLOUD_INPUT_TOPIC:-/livox/lidar}"
      IMU_INPUT_TOPIC: "${IMU_INPUT_TOPIC:-/livox/imu}"
      POINTCLOUD_OUTPUT_TOPIC: "${POINTCLOUD_OUTPUT_TOPIC:-/cloud_registered}"
      ODOM_OUTPUT_TOPIC: "${ODOM_OUTPUT_TOPIC:-/odom}"
      GLOBAL_FRAME: "${GLOBAL_FRAME:-odom}"
      BASE_FRAME: "${BASE_FRAME:-base_link}"
      LIDAR_FRAME: "${LIDAR_FRAME:-lidar_link}"
      IMU_FRAME: "${IMU_FRAME:-imu_link}"
    ulimits:
      memlock: -1
      stack: 67108864

volumes:
  lidar_ros_logs:
  localization_ros_logs:
