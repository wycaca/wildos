/**:
  ros__parameters:
    # 输入输出 topic, 平台差异优先由 topic_profiles.yaml 覆盖
    output_goal_topic: /spot1/graphnav_goal_pose
    status_topic: /spot1/object_search_status
    object_target_estimate_topic: /spot1/object_target_estimate
    object_reached_topic: /spot1/object_search_reached
    completion_topic: /spot1/object_search_completed
    odom_topic: /spot1/odom_for_scoring
    nav_graph_topic: /spot1/nav_graph
    scored_nav_graph_topic: /spot1/scored_nav_graph
    frame_id: map

    # 启动时根据首帧 odom 计算一次固定粗目标, 后续转向和移动不会重算
    initial_goal_distance: 30.0
    initial_goal_heading_deg: 0.0

    # 先静止等待地图和视觉评分就绪, 前向不足时仅左右小角度观察
    startup_observation_enabled: true
    startup_warmup_sec: 3.0
    startup_min_nav_graph_frames: 6
    startup_min_scored_graph_frames: 3
    startup_min_forward_nodes: 3
    startup_min_forward_frontiers: 1
    startup_forward_range: 8.0
    startup_forward_half_angle_deg: 70.0
    startup_graph_timeout_sec: 2.0
    startup_scan_enabled: true
    startup_scan_trigger_frames: 3
    startup_scan_yaw_deg: 35.0
    startup_scan_yaw_tolerance_deg: 5.0
    startup_scan_hold_sec: 0.5
    startup_scan_phase_timeout_sec: 4.0

    # 论文式两视角视觉粗定位先替换初始探索 goal, 稳定估计随后提升精度
    publish_rate: 5.0
    object_reached_timeout_sec: 2.0
    object_reached_max_target_distance: 2.0
    lidar_reached_timeout_sec: 2.0
    coarse_target_min_views: 2
    coarse_target_min_confidence: 0.45
    coarse_target_max_distance: 30.0
    coarse_target_timeout_sec: 3.0
    target_max_vertical_offset: 1.5
    coarse_target_max_horizontal_std: 8.0
    target_update_min_distance: 0.75
    stable_target_update_min_distance: 0.3

    # 粗目标先停在安全观察距离, 对准等待后再横向移动形成视差
    coarse_observation_distance: 2.75
    coarse_observation_entry_tolerance: 0.4
    target_observation_duration_sec: 2.0
    target_observation_reposition_distance: 0.75
    target_observation_reposition_tolerance: 0.4
    target_observation_lost_timeout_sec: 2.0
    target_observation_scan_yaw_deg: 20.0
    target_observation_scan_tolerance_deg: 5.0
    target_observation_scan_hold_sec: 0.5
    pending_evidence_protection_sec: 3.0
    pending_observation_duration_sec: 1.5
    pending_reposition_distance: 0.6
    pending_reposition_tolerance: 0.3
    pending_reposition_visibility_timeout_sec: 1.5

    # 稳定目标先到安全观察距离, 再静止确认或小范围换位
    final_observation_distance: 1.75
    final_observation_entry_tolerance: 0.4
    final_observation_duration_sec: 2.0
    final_observation_lost_timeout_sec: 2.0
    final_observation_scan_yaw_deg: 15.0
    final_observation_scan_tolerance_deg: 5.0
    final_observation_scan_hold_sec: 0.5
    final_observation_reposition_distance: 0.9
    final_observation_reposition_tolerance: 0.35
