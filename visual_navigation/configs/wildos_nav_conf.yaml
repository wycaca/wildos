# Model Params
frontier_ckpt: frontier_ckpt_new.ckpt
traversability_ckpt: traversability_ckpt.ckpt
model_version: c-radio_v3-b
adaptor_version: null
use_naclip: true
use_summary_for_spatial: true
radio_dim: 768
static_scale_factor: 0.75
model_precision: FP16

# Nav Params
num_cameras: 3
cams_inverted: false
camera_image_flip_x: false
num_angular_bins: 16
reach_in_2D: true

# Nav graph params
frontiers_range: 9.0
traversability_class: default
heading_sim_thresh: 0.0
default_max_score: 0.3
std_for_default_scores: 80.0
std_for_frontier_heading: null

# Pixel Scoring Params
frontier_threshold: 0.6
frontier_opening_kernel_size: 20
traversability_threshold: 0.9
frontier_w: 2.0
goal_w: 3.0
reachability_w: 2.0
scoring_method: "MULTIPLICATIVE"
reach_scale: 0.25
compute_paths: false

# ROS2 frames and topics
parent_frame: spot1/odom
cam_frame: "{}_color_optical_frame"
camera_img_topic: /spot1/realsense/{}/color/image_raw/compressed
camera_info_topic: /spot1/realsense/{}/color/camera_info
odometry_topic: /spot1/odom
navigation_graph_topic: /spot1/nav_graph

# ROS2 Publisher topics
scored_navgraph_topic: /spot1/scored_nav_graph
object_mask_topic: /spot1/object_mask
object_completed_topic: /spot1/object_search_completed
object_search_target_topic: /spot1/object_search_target
processing_rate_hz: 10.0
scored_graph_heartbeat_sec: 1.0
frontier_score_publish_epsilon: 0.001
diagnostics_enabled: true
diagnostics_period_sec: 30.0

# ROS2 subscriber params
qos_history_depth: 1
syncsub_queue_size: 2
syncsub_slop: 0.2
odometry_match_max_delta_sec: 3.0
navigation_graph_max_age_sec: 6.0

# Object Search Config
object_search_config:
    text_queries:
        - "chair"
    pixel_level_seg: false
    mask_threshold: 0.09
    detection_min_peak_score: 0.12
    detection_confirm_min_peak_score: 0.110
    detection_min_component_pixels: 300
    detection_min_component_fraction: 0.0005
    detection_confirm_frames: 2
    detection_confirm_window_frames: 3
    obj_frontier_score: 0.9
    obj_trav_score: 0.9

# TFLookup Config
tf_lookup_config:
    buffer_size: 1
    cache_time: 10
    timer_duration: 0.1
    lookup_timeout: 0
    qos_history_depth: 1
    wait_for_oldest: false
    clear_buffer_on_process: true
    spin_thread: false
    allow_latest_tf_on_past_extrapolation: false
