launch:
  - arg:
      name: "ns"
      default: ""
      description: "Namespace of the robot"

  - arg:
      name: "use_sim_time" 
      default: "False"
      description: "Use simulation time"

  - arg:
      name: "remap_ros_topics_to_ns"
      default: "True"
      description: "Remap ros topics to namespace"
  - arg:
      name: "remap_tf_to_ns"
      default: $(var remap_ros_topics_to_ns)
      description: "Remap tf/tf_static to namespace"

  - arg:
      name: "odom_topic"
      default: "/odom"
      description: "Odometry topic relative to namespace or absolute"

  - node:
      pkg: "graphnav_planner"
      exec: "planner_node"
      name: "graphnav_planner"
      output: screen
      namespace: $(var ns)
      # launch-prefix: "gdb -batch --return-child-result -ex run -ex backtrace --args"
      param:
        - name: use_sim_time
          value: $(var use_sim_time)
        - name: frontier_dist_cost_factor
          value: 2.0
        - name: goal_dist_cost_factor
          value: 1.0
        - name: frontier_score_factor
          value: 20.0
        - name: frontier_continuity_radius
          value: 10.0
        - name: frontier_progress_timeout
          value: 12.0
        - name: revisit_cost_factor
          value: 1.0
        - name: trav_class
          value: "default"
        - name: goal_radius
          value: 3.0
      remap:
        - from: "~/nav_graph"
          to: "scored_nav_graph"
        - from: "~/odom"
          to: $(var odom_topic)
        - from: "~/goal_pose"
          to: "/goal_pose"
        - from: "~/object_search_status"
          to: "/spot1/object_search_status"
        # - from: "~/path"
        #   to: "graph_nav_path"
        # namespaced default ros topics
        - from: "/tf"
          to: $(eval "'/$(var ns)/tf' if '$(var remap_tf_to_ns)'.lower() == 'true' else '/tf'")
        - from: "/tf_static"
          to: $(eval "'/$(var ns)/tf_static' if '$(var remap_tf_to_ns)'.lower() == 'true' else '/tf_static'")
        - from: "/rosout"
          to: $(eval "'/$(var ns)/rosout' if '$(var remap_ros_topics_to_ns)'.lower() == 'true' else '/rosout'")
        - from: "/parameter_events"
          to: $(eval "'/$(var ns)/parameter_events' if '$(var remap_ros_topics_to_ns)'.lower() == 'true' else '/parameter_events'")
        - from: "/diagnostics"
          to: $(eval "'/$(var ns)/diagnostics' if '$(var remap_ros_topics_to_ns)'.lower() == 'true' else '/diagnostics'")
  - node:
      pkg: "graphnav_planner"
      exec: "path_follower_node"
      name: "graphnav_path_follower"
      output: screen
      namespace: $(var ns)
      remap:
        - from: "~/path"
          to: "/path2"
        - from: "~/odom"
          to: $(var odom_topic)
        - from: "~/goal_pose"
          to: "/goal_pose"
        # namespaced default ros topics
        - from: "/tf"
          to: $(eval "'/$(var ns)/tf' if '$(var remap_tf_to_ns)'.lower() == 'true' else '/tf'")
        - from: "/tf_static"
          to: $(eval "'/$(var ns)/tf_static' if '$(var remap_tf_to_ns)'.lower() == 'true' else '/tf_static'")
        - from: "/rosout"
          to: $(eval "'/$(var ns)/rosout' if '$(var remap_ros_topics_to_ns)'.lower() == 'true' else '/rosout'")
        - from: "/parameter_events"
          to: $(eval "'/$(var ns)/parameter_events' if '$(var remap_ros_topics_to_ns)'.lower() == 'true' else '/parameter_events'")
        - from: "/diagnostics"
          to: $(eval "'/$(var ns)/diagnostics' if '$(var remap_ros_topics_to_ns)'.lower() == 'true' else '/diagnostics'")
      param:
        - name: wp_lookahead_dist
          value: 5.0
        - name: use_sim_time
          value: $(var use_sim_time)
